name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: core — typecheck
        working-directory: packages/core
        run: pnpm run typecheck

      - name: core — create db, migrate, test
        working-directory: packages/core
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bp_core_test
          APP_DATABASE_URL: postgres://app_user:app_user@localhost:5432/bp_core_test
          CORE_APP_USER_PASSWORD: app_user
        run: |
          pnpm exec tsx scripts/create-db.ts
          pnpm run migrate
          pnpm run test

      - name: ledger — typecheck
        working-directory: packages/ledger
        run: pnpm run typecheck

      - name: ledger — create db, migrate, test
        working-directory: packages/ledger
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bp_ledger_test
          APP_DATABASE_URL: postgres://app_user:app_user@localhost:5432/bp_ledger_test
          CORE_APP_USER_PASSWORD: app_user
        run: |
          pnpm exec tsx scripts/create-db.ts
          pnpm run migrate
          pnpm run test
